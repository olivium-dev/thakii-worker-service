name: Enable Worker API

on:
  workflow_dispatch:

jobs:
  enable-worker:
    runs-on: ubuntu-22.04
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 🔧 Setup SSH via Cloudflare
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        sudo apt-get update && sudo apt-get install -y sshpass
    
    - name: Enable Worker API on thakii-03
      env:
        THAKII_PASSWORD: ${{ secrets.THAKII_03_PASSWORD }}
      run: |
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2200 &
        TUNNEL_PID=$!
        sleep 15
        
        sshpass -p "$THAKII_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2200 fanusdigital@localhost << 'ENDSSH'
        set -e
        cd /Users/fanusdigital/thakii-worker-service
        
        echo '🔧 Enabling Worker API on worker...'
        
        # Backup current .env
        cp .env .env.backup-$(date +%Y%m%d%H%M%S)
        
        # Enable Worker API
        if grep -q 'ENABLE_WORKER_API' .env; then
          sed -i '' 's/ENABLE_WORKER_API=.*/ENABLE_WORKER_API=true/' .env
        else
          echo 'ENABLE_WORKER_API=true' >> .env
        fi
        
        # Set MAX_CONCURRENT_TASKS to 4
        if grep -q 'MAX_CONCURRENT_TASKS' .env; then
          sed -i '' 's/MAX_CONCURRENT_TASKS=.*/MAX_CONCURRENT_TASKS=4/' .env
        else
          echo 'MAX_CONCURRENT_TASKS=4' >> .env
        fi
        
        # Verify the change
        echo '✅ Worker .env updated:'
        grep -E 'ENABLE_WORKER_API|MAX_CONCURRENT_TASKS' .env
        
        # Stop any existing worker_api process
        pkill -f "python.*worker_api.py" || echo "No existing worker_api process"
        sleep 2
        
        # Start Worker API manually (NO LaunchAgent)
        echo '🚀 Starting Worker API manually...'
        cd /Users/fanusdigital/thakii-worker-service
        nohup /opt/homebrew/bin/python3 -u worker_api.py > logs/worker_api.log 2>&1 &
        WORKER_API_PID=$!
        sleep 3
        
        # Verify it's running
        if ps -p $WORKER_API_PID > /dev/null; then
          echo "✅ Worker API started successfully (PID: $WORKER_API_PID)"
        else
          echo "❌ Worker API failed to start - check logs/worker_api.log"
          tail -20 logs/worker_api.log
        fi
        
        echo '✅ Worker API enabled and started manually'
        ENDSSH
        
        kill $TUNNEL_PID 2>/dev/null || true
