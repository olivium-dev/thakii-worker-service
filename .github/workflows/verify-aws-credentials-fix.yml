name: 🔍 Verify AWS Credentials Fix

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to verify'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  verify-fix:
    name: 🔍 Strict AWS Credentials Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Deployment Tools
      run: |
        echo "🔧 Installing deployment tools..."
        sudo apt-get update -qq && sudo apt-get install -y sshpass jq curl
        # Install Cloudflare CLI for SSH proxy
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        echo "✅ Deployment tools ready"

    - name: 🔑 Setup SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.thakii_ssh_private_key }}
      run: |
        echo "🔑 Setting up SSH configuration..."
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Setup SSH private key
        echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/thakii-key 2>/dev/null || echo "$SSH_PRIVATE_KEY" > ~/.ssh/thakii-key
        chmod 600 ~/.ssh/thakii-key
        
        # Validate SSH key
        ssh-keygen -l -f ~/.ssh/thakii-key || echo "SSH key validation failed"
        
        # Create SSH config for Cloudflare proxy access
        cat > ~/.ssh/config << EOF
        Host production-server
          HostName vps-71.fds-1.com
          User ec2-user
          IdentityFile ~/.ssh/thakii-key
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF
        
        chmod 600 ~/.ssh/config

    - name: 📋 Deploy Verification Script
      run: |
        echo "📋 Copying verification script to server..."
        scp -i ~/.ssh/thakii-key -o ProxyCommand="cloudflared access ssh --hostname %h" -o StrictHostKeyChecking=no \
          scripts/verify_aws_credentials_fix.sh \
          ec2-user@vps-71.fds-1.com:/home/ec2-user/verify_aws_credentials_fix.sh
        
        echo "✅ Verification script deployed"

    - name: 🔍 Run Strict Verification Tests
      id: verification
      run: |
        echo "🔍 Running comprehensive AWS credentials verification..."
        echo ""
        
        # Run verification script and capture output
        ssh -i ~/.ssh/thakii-key -o ProxyCommand="cloudflared access ssh --hostname %h" -o StrictHostKeyChecking=no \
          ec2-user@vps-71.fds-1.com \
          'chmod +x /home/ec2-user/verify_aws_credentials_fix.sh && bash /home/ec2-user/verify_aws_credentials_fix.sh' \
          2>&1 | tee verification_output.txt
        
        # Check if verification passed
        if grep -q "ALL TESTS PASSED" verification_output.txt; then
          echo "verification_status=PASSED" >> $GITHUB_OUTPUT
          echo "✅ VERIFICATION SUCCESSFUL"
        else
          echo "verification_status=FAILED" >> $GITHUB_OUTPUT
          echo "❌ VERIFICATION FAILED"
          exit 1
        fi

    - name: 🧪 Additional Backend Health Checks
      if: steps.verification.outputs.verification_status == 'PASSED'
      run: |
        echo "🧪 Running additional health checks..."
        
        # Test 1: Health endpoint
        echo "Testing health endpoint..."
        HEALTH_RESPONSE=$(curl -s "https://thakii-02.fanusdigital.site/thakii-be/health")
        echo "Health response: $HEALTH_RESPONSE"
        
        if echo "$HEALTH_RESPONSE" | jq -e '.status' >/dev/null 2>&1; then
          echo "✅ Health endpoint working"
        else
          echo "❌ Health endpoint failed"
          exit 1
        fi
        
        # Test 2: List endpoint (should not return 500)
        echo "Testing list endpoint..."
        LIST_STATUS=$(curl -s -w "%{http_code}" "https://thakii-02.fanusdigital.site/thakii-be/list" -o /dev/null)
        echo "List endpoint status: $LIST_STATUS"
        
        if [ "$LIST_STATUS" != "500" ]; then
          echo "✅ List endpoint not returning 500"
        else
          echo "❌ List endpoint still returning 500"
          exit 1
        fi
        
        # Test 3: Upload endpoint accessibility (should not immediately return 500)
        echo "Testing upload endpoint accessibility..."
        UPLOAD_STATUS=$(curl -s -w "%{http_code}" -X POST "https://thakii-02.fanusdigital.site/thakii-be/upload" -o /dev/null)
        echo "Upload endpoint status: $UPLOAD_STATUS"
        
        # 400 or 422 is expected (missing form data), 500 is bad
        if [ "$UPLOAD_STATUS" != "500" ]; then
          echo "✅ Upload endpoint not returning 500 (got $UPLOAD_STATUS - expected for missing data)"
        else
          echo "❌ Upload endpoint still returning 500"
          exit 1
        fi

    - name: 📊 Generate Verification Report
      if: always()
      run: |
        echo "## 🔍 AWS Credentials Fix Verification Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.verification.outputs.verification_status }}" = "PASSED" ]; then
          echo "### ✅ VERIFICATION SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **All tests passed! The AWS credentials fix is working correctly.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What was verified:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Systemd service has AWS credentials in environment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AWS credentials are not empty" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ S3 connectivity works with systemd credentials" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend service is running" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend health endpoint responds correctly" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend endpoints do not return 500 errors" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ S3 upload simulation successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Test video upload from frontend" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify end-to-end PDF generation" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor for any remaining issues" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ VERIFICATION FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💥 **Some tests failed. The AWS credentials fix needs attention.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Troubleshooting Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check systemd service configuration" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify AWS credentials in .env file" >> $GITHUB_STEP_SUMMARY
          echo "3. Check backend service logs" >> $GITHUB_STEP_SUMMARY
          echo "4. Re-run the fix script" >> $GITHUB_STEP_SUMMARY
          echo "5. Restart backend service" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Test Details:" >> $GITHUB_STEP_SUMMARY
        echo "- **Server**: vps-71.fds-1.com" >> $GITHUB_STEP_SUMMARY
        echo "- **Service**: thakii-backend.service" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend Path**: /home/ec2-user/thakii-backend-api" >> $GITHUB_STEP_SUMMARY
        echo "- **Verification Script**: verify_aws_credentials_fix.sh" >> $GITHUB_STEP_SUMMARY
        
        # Include verification output if available
        if [ -f verification_output.txt ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Detailed Test Output:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 verification_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: 🎯 Final Status Check
      run: |
        if [ "${{ steps.verification.outputs.verification_status }}" = "PASSED" ]; then
          echo "🎉 SUCCESS: AWS credentials fix verification completed successfully!"
          echo "✅ The backend 500 error should be resolved"
          echo "✅ Video uploads should work from frontend"
          echo "✅ End-to-end pipeline should be functional"
        else
          echo "❌ FAILURE: AWS credentials fix verification failed"
          echo "💥 The backend may still have issues"
          echo "🔧 Manual intervention required"
          exit 1
        fi
