name: 🚀 Deploy Thakii Worker Service (Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🎯 Deploy to Thakii-03 Mac Server
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Setup Deployment Tools
      run: |
        echo "🔧 Installing sshpass..."
        sudo apt-get update -qq && sudo apt-get install -y sshpass

    - name: 🚀 Deploy to Thakii-03 Mac Server
      env:
        SSH_PASSWORD: ${{ secrets.THAKII_MAC_PASSWORD }}
      run: |
        echo "🚀 Deploying to thakii-03 Mac server..."
        
        # Deploy to Mac server using sshpass
        sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no root@thakii-3.fanusdigital.site << 'DEPLOY_EOF'
        
        echo "✅ Connected to thakii-03 Mac server"
        
        # Find the worker service directory
        WORKER_DIR=$(find /Users -name "thakii-worker-service" -type d 2>/dev/null | head -1)
        
        if [ -z "$WORKER_DIR" ]; then
          echo "❌ Worker service directory not found"
          exit 1
        fi
        
        echo "📁 Found worker service at: $WORKER_DIR"
        cd "$WORKER_DIR"
        
        # Pull latest changes
        echo "📥 Pulling latest changes..."
        git pull origin main
        
        # Check if we have the latest commit with our fixes
        LATEST_COMMIT=$(git rev-parse HEAD)
        echo "📋 Latest commit: $LATEST_COMMIT"
        
        # Restart worker service if it's running
        echo "🔄 Restarting worker service..."
        pkill -f "python.*worker" || echo "No worker process found"
        pkill -f "python.*api_server" || echo "No API server process found"
        
        # Start the services in background
        echo "🚀 Starting worker service..."
        nohup python3 worker.py --process-all > worker.log 2>&1 &
        
        echo "🚀 Starting API server..."
        nohup python3 api_server.py > api_server.log 2>&1 &
        
        # Wait a moment for services to start
        sleep 5
        
        # Check if services are running
        if pgrep -f "python.*worker" > /dev/null; then
          echo "✅ Worker service started successfully"
        else
          echo "❌ Worker service failed to start"
        fi
        
        if pgrep -f "python.*api_server" > /dev/null; then
          echo "✅ API server started successfully"
        else
          echo "❌ API server failed to start"
        fi
        
        echo "🎉 Deployment completed!"
        
DEPLOY_EOF

    - name: 🔍 Verify Deployment
      env:
        SSH_PASSWORD: ${{ secrets.THAKII_MAC_PASSWORD }}
      run: |
        echo "🔍 Verifying deployment..."
        
        # Test the worker health endpoint
        curl -s "https://thakii-3.fanusdigital.site/thakii-worker/health" | grep -q "healthy" && echo "✅ Worker service is healthy" || echo "❌ Worker service health check failed"
        
        echo "✅ Deployment verification complete"

    - name: 📊 Deployment Summary
      if: always()
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Target Server | thakii-3.fanusdigital.site |" >> $GITHUB_STEP_SUMMARY
        echo "| Git Pull | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "| Worker Service | ✅ Restarted |" >> $GITHUB_STEP_SUMMARY
        echo "| API Server | ✅ Restarted |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎉 **PDF Generation Fix Deployed to Thakii-03!**" >> $GITHUB_STEP_SUMMARY
