name: Deploy Thakii Worker Service v2

on:
  push:
    branches: [ main, feature/whisper-ai-installation-pipeline ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb
        
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H vps-71.fds-1.com >> ~/.ssh/known_hosts
        
    - name: Test SSH connection
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "echo 'SSH connection successful'"
        
    - name: Check server status
      run: |
        echo "=== Server Status Check ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          echo 'Current directory:' && pwd &&
          echo 'Disk space:' && df -h / &&
          echo 'Memory usage:' && free -h &&
          echo 'Python version:' && python3 --version &&
          echo 'Git status in worker service:' && cd thakii-worker-service && git status
        "
        
    - name: Backup current deployment
      run: |
        echo "=== Creating Backup ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          cd ~ &&
          BACKUP_DIR=\"backups/thakii-worker-\$(date +%Y%m%d-%H%M%S)\" &&
          mkdir -p \$BACKUP_DIR &&
          cp -r thakii-worker-service \$BACKUP_DIR/ &&
          echo \"Backup created at: \$BACKUP_DIR\"
        "
        
    - name: Stop services before deployment
      run: |
        echo "=== Stopping Services ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          sudo systemctl stop thakii-api.service || echo 'API service was not running' &&
          sudo systemctl stop thakii-worker.service || echo 'Worker service was not running' &&
          sleep 5 &&
          echo 'Services stopped'
        "
        
    - name: Deploy code changes
      run: |
        echo "=== Deploying Code Changes ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          cd thakii-worker-service &&
          git fetch origin &&
          git reset --hard origin/\$(git branch --show-current) &&
          echo 'Code updated successfully'
        "
        
    - name: Update dependencies
      run: |
        echo "=== Updating Dependencies ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          cd thakii-worker-service &&
          source venv/bin/activate &&
          pip install --upgrade pip &&
          pip install -r requirements.txt &&
          echo 'Dependencies updated successfully'
        "
        
    - name: Update environment configuration
      run: |
        echo "=== Updating Environment Configuration ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          cd thakii-worker-service &&
          # Ensure .env file exists with correct permissions
          if [ ! -f .env ]; then
            cp .env.example .env
          fi &&
          chmod 600 .env &&
          # Update Firebase service account if needed
          if [ ! -f firebase-service-account.json ]; then
            echo 'Warning: firebase-service-account.json not found'
          fi &&
          echo 'Environment configuration updated'
        "
        
    - name: Run pre-deployment tests
      run: |
        echo "=== Running Pre-deployment Tests ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          cd thakii-worker-service &&
          source venv/bin/activate &&
          # Test Python imports
          python3 -c 'import sys; sys.path.insert(0, \"src\"); from main import CommandLineArgRunner; print(\"✅ Main imports successful\")' &&
          python3 -c 'from core.postgres_integration import postgres_client; print(\"✅ PostgreSQL integration available:\", postgres_client.is_available())' &&
          python3 -c 'from core.s3_integration import s3_client; print(\"✅ S3 integration available:\", s3_client.is_available())' &&
          echo 'Pre-deployment tests passed'
        "
        
    - name: Start worker service
      run: |
        echo "=== Starting Worker Service ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          sudo systemctl start thakii-worker.service &&
          sleep 10 &&
          sudo systemctl status thakii-worker.service --no-pager &&
          echo 'Worker service started'
        "
        
    - name: Start API service
      run: |
        echo "=== Starting API Service ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          sudo systemctl start thakii-api.service &&
          sleep 10 &&
          sudo systemctl status thakii-api.service --no-pager &&
          echo 'API service started'
        "
        
    - name: Verify deployment
      run: |
        echo "=== Verifying Deployment ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          # Check service status
          echo '--- Service Status ---' &&
          sudo systemctl is-active thakii-worker.service &&
          sudo systemctl is-active thakii-api.service &&
          
          # Check API health
          echo '--- API Health Check ---' &&
          sleep 5 &&
          curl -f http://localhost:9000/health | jq . &&
          
          # Check worker logs
          echo '--- Worker Logs (last 10 lines) ---' &&
          sudo journalctl -u thakii-worker.service --no-pager -n 10 &&
          
          # Check API logs
          echo '--- API Logs (last 10 lines) ---' &&
          sudo journalctl -u thakii-api.service --no-pager -n 10 &&
          
          echo 'Deployment verification completed'
        "
        
    - name: Test API endpoints
      run: |
        echo "=== Testing API Endpoints ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          echo 'Testing /health endpoint:' &&
          curl -s http://localhost:9000/health | jq '.status' &&
          
          echo 'Testing /list endpoint:' &&
          LIST_RESPONSE=\$(curl -s http://localhost:9000/list) &&
          echo \$LIST_RESPONSE | jq '.total' &&
          
          echo 'Testing / endpoint:' &&
          curl -s http://localhost:9000/ | jq '.service' &&
          
          echo 'All API endpoints tested successfully'
        "
        
    - name: Enable services for auto-start
      run: |
        echo "=== Enabling Services for Auto-start ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          sudo systemctl enable thakii-worker.service &&
          sudo systemctl enable thakii-api.service &&
          echo 'Services enabled for auto-start'
        "
        
    - name: Deployment summary
      run: |
        echo "=== Deployment Summary ==="
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="cloudflared access ssh --hostname %h" ec2-user@vps-71.fds-1.com "
          echo '🚀 Deployment completed successfully!' &&
          echo '📊 Final Status:' &&
          echo '  - Worker Service:' \$(sudo systemctl is-active thakii-worker.service) &&
          echo '  - API Service:' \$(sudo systemctl is-active thakii-api.service) &&
          echo '  - Deployment Time:' \$(date) &&
          echo '  - Git Commit:' \$(cd thakii-worker-service && git rev-parse --short HEAD) &&
          echo '🎉 Worker service deployment pipeline completed!'
        "