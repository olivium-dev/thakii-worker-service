name: List Cloudflare Tunnels

on:
  workflow_dispatch:

jobs:
  list-tunnels:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 🔧 Setup SSH via Cloudflare
      run: |
        # Install cloudflared and sshpass
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        sudo apt-get update && sudo apt-get install -y sshpass
        
        # Setup SSH config with password authentication
        mkdir -p ~/.ssh
        cat >> ~/.ssh/config << 'EOF'
        Host thakii-03
          HostName ssh-thakii-3.fanusdigital.site
          User fanusdigital
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
          PreferredAuthentications password
        EOF
    
    - name: 📋 List Cloudflare Tunnels
      env:
        THAKII_PASSWORD: ${{ secrets.THAKII_03_PASSWORD }}
      run: |
        echo "🔍 Starting Cloudflare tunnel..."
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2200 &
        TUNNEL_PID=$!
        sleep 15
        
        echo "📋 Listing Cloudflare tunnels on thakii-03..."
        sshpass -p "$THAKII_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2200 fanusdigital@localhost << 'ENDSSH'
        echo "=== Cloudflared Version ==="
        cloudflared --version
        
        echo ""
        echo "=== Cloudflare Tunnels ==="
        cloudflared tunnel list
        
        echo ""
        echo "=== Running Cloudflared Processes ==="
        ps aux | grep cloudflared | grep -v grep
        
        echo ""
        echo "=== Cloudflared Config Files ==="
        find ~/.cloudflared -type f | sort
        
        echo ""
        echo "=== Network Connections ==="
        lsof -i | grep cloudflared || echo "No active connections found"
        ENDSSH
        
        # Cleanup tunnel
        kill $TUNNEL_PID 2>/dev/null || true
        wait $TUNNEL_PID 2>/dev/null || true
