name: Deploy Thakii-03 Worker (Production)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-thakii03-production.yml'
      - 'TRIGGER_DEPLOY'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 🔧 Setup SSH via Cloudflare
      run: |
        # Install cloudflared and sshpass
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        sudo apt-get update && sudo apt-get install -y sshpass
        
        # Setup SSH config with password authentication
        mkdir -p ~/.ssh
        cat >> ~/.ssh/config << 'EOF'
        Host thakii-03
          HostName ssh-thakii-3.fanusdigital.site
          User fanusdigital
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
          PreferredAuthentications password
        EOF
    
    - name: 🧹 Reclaim disk space on thakii-03
      env:
        THAKII_PASSWORD: ${{ secrets.THAKII_03_PASSWORD }}
      run: |
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2199 &
        TUNNEL_PID=$!
        sleep 15
        sshpass -p "$THAKII_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2199 fanusdigital@localhost <<'ENDSSH'
        set +e
        echo "=== Disk usage BEFORE cleanup ==="
        df -h / 2>/dev/null
        echo
        echo "=== Where are the bytes? top dirs under /Users/fanusdigital ==="
        du -sh /Users/fanusdigital/* 2>/dev/null | sort -h | tail -10
        echo
        echo "=== Top dirs inside the worker service ==="
        du -sh /Users/fanusdigital/thakii-worker-service/* 2>/dev/null | sort -h | tail -10
        echo
        echo "=== Top consumers under /tmp ==="
        du -sh /tmp/* 2>/dev/null | sort -h | tail -10
        echo
        echo "=== Removing stale worker temp files ==="

        ## /tmp sweep
        rm -rf /tmp/thakii-worker 2>/dev/null
        find /tmp -maxdepth 1 -name 'tmp*' -type d -mmin +5 -exec rm -rf {} + 2>/dev/null
        find /tmp -maxdepth 2 \( -name '*.mp4' -o -name '*.pdf' -o -name '*.srt' -o -name '*.mp4.*' \) \
                  -type f -mmin +5 -delete 2>/dev/null

        ## Worker's own working directory: orphan video / pdf / srt that
        ## process_video should have cleaned but didn't (older than 30 min).
        WS=/Users/fanusdigital/thakii-worker-service
        find "$WS" -maxdepth 3 \( -name '*.mp4' -o -name '*.srt' \) \
                   -not -path '*/workdir/*' \
                   -type f -mmin +30 -size +10M -delete 2>/dev/null

        ## Persistent workdir: only prune dirs > 24h old AND without lock.json
        WDBASE="$WS/workdir"
        if [ -d "$WDBASE" ]; then
          echo "=== Pruning stale persistent workdirs ==="
          find "$WDBASE" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | while read D; do
            if [ -f "${D}/lock.json" ]; then
              echo "  SKIP locked: $D"
              continue
            fi
            AGE_MIN=$(python3 -c "import os,time; print(int((time.time()-os.path.getmtime('$D'))/60))" 2>/dev/null || echo 0)
            if [ "$AGE_MIN" -gt 1440 ]; then
              echo "  PRUNE (age=${AGE_MIN}m): $D"
              rm -rf "$D"
            else
              echo "  KEEP (age=${AGE_MIN}m): $D"
            fi
          done
        fi
        # Direct-upload PDFs created in the worker dir; keep none older than 1 day
        find "$WS" -maxdepth 1 -name 'direct-*.pdf' -mtime +1 -delete 2>/dev/null
        find "$WS" -maxdepth 1 -name 'direct-*.mp4' -mtime +1 -delete 2>/dev/null

        ## Worker logs: rotate aggressively. systemd doesn't manage these
        ## logs (LaunchAgent appends forever), so they grow unbounded.
        # Truncate live logs in place (keeps file handle open for tail -f)
        for L in worker.log worker_error.log api_server.log api_server_error.log rq_worker.log rq_worker_error.log; do
          if [ -f "$WS/logs/$L" ]; then
            SIZE_MB=$(du -m "$WS/logs/$L" 2>/dev/null | awk '{print $1}')
            if [ "${SIZE_MB:-0}" -gt 100 ]; then
              # Keep last 5000 lines for forensics
              TAIL=$(tail -5000 "$WS/logs/$L" 2>/dev/null)
              : > "$WS/logs/$L"
              echo "$TAIL" >> "$WS/logs/$L"
              echo "Truncated $L (was ${SIZE_MB} MB, kept last 5000 lines)"
            fi
          fi
        done
        # Old rotated logs / partials
        find "$WS/logs" -type f -name '*.log.*' -delete 2>/dev/null
        find "$WS/logs" -type f -mtime +7 -delete 2>/dev/null

        ## Big system / user-cache hogs (typical macOS culprits)
        # Whisper/torch model caches kept across deploys; only delete if huge
        for CACHE in ~/.cache/whisper ~/.cache/huggingface ~/.cache/pip ~/Library/Caches/pip ~/Library/Caches/com.apple.dt.Xcode; do
          if [ -d "$CACHE" ]; then
            SIZE_MB=$(du -sm "$CACHE" 2>/dev/null | awk '{print $1}')
            if [ "${SIZE_MB:-0}" -gt 2048 ]; then
              echo "Pruning $CACHE (${SIZE_MB} MB)"
              rm -rf "$CACHE"/* 2>/dev/null
            fi
          fi
        done

        ## Other tmp-ish dirs
        find /tmp -maxdepth 1 -name 'postgres_tunnel*.log' -size +10M -mtime +3 -delete 2>/dev/null
        find /tmp -maxdepth 1 -name 'tunnel_monitor.log' -size +10M -mtime +3 -delete 2>/dev/null
        find /tmp -maxdepth 1 -name 'cloudflare-tunnel.log*' -size +10M -mtime +3 -delete 2>/dev/null

        ## External SSD temp if present
        if [ -d /mnt/external-ssd/temp ]; then
          rm -rf /mnt/external-ssd/temp/* 2>/dev/null
        fi

        ## macOS: empty Trash for the worker user
        rm -rf ~/.Trash/* 2>/dev/null

        echo
        echo "=== Disk usage AFTER cleanup ==="
        df -h / 2>/dev/null
        echo
        echo "=== Largest 15 files anywhere under /Users/fanusdigital (>100 MB) ==="
        find /Users/fanusdigital -type f -size +100M 2>/dev/null | xargs -I{} du -h "{}" 2>/dev/null | sort -h | tail -15

        FREE_KB=$(df -k / 2>/dev/null | awk 'NR==2{print $4}')
        FREE_GB=$(awk -v k="$FREE_KB" 'BEGIN{printf "%.2f", k/1024/1024}')
        echo
        echo "Free on / after cleanup: ${FREE_GB} GB"
        # Threshold rationale:
        #   * Pre-flight in s3_integration.download_video fails any task
        #     that needs >free space, so we no longer ENOSPC mid-download.
        #   * Most batch-imported videos are 400-700 MB; a 3 GB floor
        #     leaves room for whisper temp files + a 700 MB download.
        #   * Bigger videos (multi-GB) will be rejected at pre-flight with
        #     a clear "insufficient disk space" error, not silently stuck.
        if awk -v g="$FREE_GB" 'BEGIN{exit !(g+0 < 3)}'; then
          echo "❌ Less than 3 GB free after cleanup — aborting deploy."
          echo "   Look at the 'Largest 15 files' dump above to find the byte hog."
          echo "   On thakii-03 (shared box), check: /Users/fanusdigital/~ (literal),"
          echo "   /Users/fanusdigital/Library, ~/.ollama/models, ~/Downloads."
          exit 1
        fi
        if awk -v g="$FREE_GB" 'BEGIN{exit !(g+0 < 10)}'; then
          echo "⚠️  Free disk is below 10 GB. Multi-GB videos will be rejected"
          echo "    at pre-flight with 'insufficient disk space' — by design."
        fi
        ENDSSH
        STATUS=$?
        kill $TUNNEL_PID 2>/dev/null || true
        wait $TUNNEL_PID 2>/dev/null || true
        exit $STATUS

    - name: 📦 Package and Deploy Code to thakii-03
      env:
        THAKII_PASSWORD: ${{ secrets.THAKII_03_PASSWORD }}
      run: |
        echo "🚀 Deploying worker service to thakii-03 via GitHub Actions..."
        
        # Create tarball of worker service files
        tar czf worker-service.tar.gz core src worker.py api_server.py rq_worker.py requirements.txt scripts
        
        # Start Cloudflare tunnel in background
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2200 &
        TUNNEL_PID=$!
        sleep 15
        
        # Ensure worker directory exists
        sshpass -p "$THAKII_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2200 fanusdigital@localhost 'mkdir -p /Users/fanusdigital/thakii-worker-service/{core,src,logs}'
        
        # Copy tarball to server
        sshpass -p "$THAKII_PASSWORD" scp -o StrictHostKeyChecking=no -P 2200 worker-service.tar.gz fanusdigital@localhost:/tmp/
        
        echo "✅ Files copied to server"
        
        # Cleanup tunnel
        kill $TUNNEL_PID 2>/dev/null || true
        wait $TUNNEL_PID 2>/dev/null || true
    
    - name: 🔧 Install Redis on thakii-03
      env:
        THAKII_PASSWORD: ${{ secrets.THAKII_03_PASSWORD }}
      run: |
        # Start Cloudflare tunnel for Redis installation
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2201 &
        TUNNEL_PID=$!
        sleep 15
        
        # Copy install script
        sshpass -p "$THAKII_PASSWORD" scp -o StrictHostKeyChecking=no -P 2201 scripts/install_redis.sh fanusdigital@localhost:/tmp/
        
        # Execute installation
        sshpass -p "$THAKII_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2201 fanusdigital@localhost << 'ENDSSH'
        chmod +x /tmp/install_redis.sh
        /tmp/install_redis.sh || echo "⚠️  Redis installation failed or already installed"
        ENDSSH
        
        echo "✅ Redis installation step completed"
        
        # Cleanup tunnel
        kill $TUNNEL_PID 2>/dev/null || true
        wait $TUNNEL_PID 2>/dev/null || true
    
    - name: 🔄 Configure and Start Services on thakii-03
      env:
        THAKII_PASSWORD: ${{ secrets.THAKII_03_PASSWORD }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        # Phase B5/C5: shared secret used to authenticate /internal/* calls.
        # Same secret is wired into the backend deploy. Empty value means
        # the backend gate is dormant (safe rollout default).
        INTERNAL_WORKER_SECRET: ${{ secrets.THAKII_INTERNAL_WORKER_SECRET }}
      run: |
        # Create .env file locally
        cat > .env << DOTENV
        USE_HTTP_DATABASE=true
        BACKEND_API_URL=https://thakii-02.fanusdigital.site/thakii-be
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME=thakii-video-storage-1753883631
        AWS_DEFAULT_REGION=us-east-2
        WORKER_POLL_INTERVAL=5
        # Run one task at a time so each (potentially multi-GB) video
        # gets the worker's full disk + CPU. Raise once parallel tasks
        # have headroom on a beefier disk.
        MAX_CONCURRENT_TASKS=1
        TEMP_DIR=/tmp/thakii-worker
        PATH_PREFIX=/thakii-worker
        ENABLE_REDIS_QUEUE=false
        REDIS_HOST=localhost
        REDIS_PORT=6379
        ENABLE_WORKER_API=true
        WORKER_ID=worker-thakii-03
        WORKER_HEARTBEAT_INTERVAL=15
        # 5 h timeout: large lecture videos (2h+) need 60-180 min of
        # Whisper transcription on MPS. The old 7200s (2h) wall killed
        # every video > ~90 min. Phase 2 will replace this with an
        # adaptive per-video hint; this is the safe ceiling until then.
        TASK_TIMEOUT_SECONDS=18000
        # Accept the full size range observed in the prod batch (max 15.6 GB).
        MAX_VIDEO_SIZE_GB=20
        # Refuse new pickups when free disk drops below this; janitor
        # has a chance to free space before the next slot runs.
        MIN_FREE_GB_TO_PICKUP=3
        # Use Apple Metal (MPS) for whisper transcription -- 3-5x faster
        # than CPU on M2. Fallback: change to "cpu" or remove if it
        # ever destabilises (worker logs the device on every pickup).
        WHISPER_DEVICE=mps
        WORKER_USE_PERSISTENT_WORKDIR=true
        WORKER_WORKDIR_BASE=/Users/fanusdigital/thakii-worker-service/workdir
        WORKDIR_RETENTION_HOURS=24
        INTERNAL_WORKER_SECRET=${INTERNAL_WORKER_SECRET}
        DOTENV
        
        # Start Cloudflare tunnel
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2201 &
        TUNNEL_PID=$!
        sleep 15
        
        # Copy .env file to server
        sshpass -p "$THAKII_PASSWORD" scp -o StrictHostKeyChecking=no -P 2201 .env fanusdigital@localhost:/tmp/worker.env
        rm .env
        
        sshpass -p "$THAKII_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2201 fanusdigital@localhost << 'ENDSSH'
        set -e
        
        cd /Users/fanusdigital/thakii-worker-service
        
        echo "🔧 DEPLOYING VIA GITHUB ACTIONS PIPELINE"
        echo "========================================="
        
        # Extract files
        echo "📦 Extracting worker service files..."
        tar xzf /tmp/worker-service.tar.gz
        rm /tmp/worker-service.tar.gz
        
        # Verify files were copied
        echo "📋 Verifying S3 integration fix:"
        if [ -f "core/s3_integration.py" ]; then
            grep -A 2 "s3_key = " core/s3_integration.py | head -5
        else
            echo "❌ ERROR: core/s3_integration.py not found!"
            exit 1
        fi
        
        # Move .env file to correct location
        echo "📝 Installing .env file..."
        mv /tmp/worker.env .env
        chmod 600 .env
        
        # Install/update dependencies (only required packages)
        echo "📦 Installing dependencies..."
        /opt/homebrew/bin/python3 -m pip install --break-system-packages \
          flask flask-cors flask-restx boto3 botocore psycopg2-binary python-dotenv requests \
          openai-whisper torch torchaudio srt opencv-python-headless fpdf2 moviepy \
          redis rq 2>&1 | tail -20
        
        echo "✅ Dependencies installed"
        
        # Create LaunchDaemon plists (using printf to avoid heredoc issues)
        echo "🔧 Creating LaunchDaemon for worker..."
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
          '<plist version="1.0"><dict>' \
          '<key>Label</key><string>com.thakii.worker</string>' \
          '<key>ProgramArguments</key><array>' \
          '<string>/opt/homebrew/bin/python3</string>' \
          '<string>/Users/fanusdigital/thakii-worker-service/worker.py</string>' \
          '</array>' \
          '<key>WorkingDirectory</key><string>/Users/fanusdigital/thakii-worker-service</string>' \
          '<key>StandardOutPath</key><string>/Users/fanusdigital/thakii-worker-service/logs/worker.log</string>' \
          '<key>StandardErrorPath</key><string>/Users/fanusdigital/thakii-worker-service/logs/worker_error.log</string>' \
          '<key>EnvironmentVariables</key><dict>' \
          '<key>PATH</key><string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>' \
          '<key>PATH_PREFIX</key><string>/thakii-worker</string>' \
          '</dict>' \
          '<key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>' \
          '<key>RunAtLoad</key><true/>' \
          '</dict></plist>' \
          > ~/Library/LaunchAgents/com.thakii.worker.plist

        echo "🔧 Creating LaunchDaemon for API server..."
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
          '<plist version="1.0"><dict>' \
          '<key>Label</key><string>com.thakii.api_server</string>' \
          '<key>ProgramArguments</key><array>' \
          '<string>/opt/homebrew/bin/python3</string>' \
          '<string>/Users/fanusdigital/thakii-worker-service/api_server.py</string>' \
          '<string>--port</string><string>8000</string>' \
          '</array>' \
          '<key>WorkingDirectory</key><string>/Users/fanusdigital/thakii-worker-service</string>' \
          '<key>StandardOutPath</key><string>/Users/fanusdigital/thakii-worker-service/logs/api_server.log</string>' \
          '<key>StandardErrorPath</key><string>/Users/fanusdigital/thakii-worker-service/logs/api_server_error.log</string>' \
          '<key>EnvironmentVariables</key><dict>' \
          '<key>PATH</key><string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>' \
          '<key>PATH_PREFIX</key><string>/thakii-worker</string>' \
          '</dict>' \
          '<key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>' \
          '<key>RunAtLoad</key><true/>' \
          '</dict></plist>' \
          > ~/Library/LaunchAgents/com.thakii.api_server.plist

        echo "🔧 Creating LaunchDaemon for RQ worker..."
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
          '<plist version="1.0"><dict>' \
          '<key>Label</key><string>com.thakii.rq_worker</string>' \
          '<key>ProgramArguments</key><array>' \
          '<string>/opt/homebrew/bin/python3</string>' \
          '<string>/Users/fanusdigital/thakii-worker-service/rq_worker.py</string>' \
          '</array>' \
          '<key>WorkingDirectory</key><string>/Users/fanusdigital/thakii-worker-service</string>' \
          '<key>StandardOutPath</key><string>/Users/fanusdigital/thakii-worker-service/logs/rq_worker.log</string>' \
          '<key>StandardErrorPath</key><string>/Users/fanusdigital/thakii-worker-service/logs/rq_worker_error.log</string>' \
          '<key>EnvironmentVariables</key><dict>' \
          '<key>PATH</key><string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>' \
          '<key>PATH_PREFIX</key><string>/thakii-worker</string>' \
          '</dict>' \
          '<key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>' \
          '<key>RunAtLoad</key><true/>' \
          '</dict></plist>' \
          > ~/Library/LaunchAgents/com.thakii.rq_worker.plist
        
        # Unload existing services
        echo "🛑 Stopping existing services..."
        launchctl unload ~/Library/LaunchAgents/com.thakii.worker.plist 2>/dev/null || echo "Worker not loaded"
        launchctl unload ~/Library/LaunchAgents/com.thakii.api_server.plist 2>/dev/null || echo "API server not loaded"
        launchctl unload ~/Library/LaunchAgents/com.thakii.rq_worker.plist 2>/dev/null || echo "RQ worker not loaded"
        
        # Kill any running processes. Old logic only matched worker.py,
        # api_server.py, rq_worker.py — but worker.py launches PDF-gen
        # via `python -m src.main ...`, which does NOT match any of those
        # patterns. The orphan whisper subprocess therefore survived every
        # deploy and competed with the new worker for CPU/GPU.
        # Kill anything matching the project paths or src.main module.
        pkill -f "python.*worker.py" || echo "No worker processes to kill"
        pkill -f "python.*api_server.py" || echo "No API server processes to kill"
        pkill -f "python.*rq_worker.py" || echo "No RQ worker processes to kill"
        pkill -f "src.main" || echo "No src.main subprocesses to kill"
        pkill -f "thakii-worker-service" || echo "No thakii-worker-service processes to kill"
        # Belt-and-braces: pkill -9 anything still alive after 3 s.
        # `pkill` returns 1 when there's nothing to kill; under `set -e`
        # that aborts the deploy. Ignore failures here — there's nothing
        # to do if the process is already dead.
        sleep 3
        pkill -9 -f "src.main" 2>/dev/null || true
        pkill -9 -f "python.*worker.py" 2>/dev/null || true
        pkill -9 -f "python.*api_server.py" 2>/dev/null || true
        pkill -9 -f "python.*rq_worker.py" 2>/dev/null || true

        sleep 5
        
        # Load and start services
        echo "🚀 Starting worker service..."
        launchctl load ~/Library/LaunchAgents/com.thakii.worker.plist
        launchctl start com.thakii.worker
        
        echo "🚀 Starting API server..."
        launchctl load ~/Library/LaunchAgents/com.thakii.api_server.plist
        launchctl start com.thakii.api_server
        
        echo "🚀 Starting RQ worker (will fail gracefully if Redis disabled)..."
        launchctl load ~/Library/LaunchAgents/com.thakii.rq_worker.plist
        launchctl start com.thakii.rq_worker || echo "⚠️ RQ worker failed to start (expected if Redis disabled)"
        
        # Ensure nginx is running (proxies Cloudflare tunnel port 8080 → Flask port 8000)
        echo "🔧 Ensuring nginx is running..."
        if ! ps aux | grep "nginx: master" | grep -v grep > /dev/null 2>&1; then
          echo "⚠️ nginx not running, fixing PID permissions and starting..."
          rm -f /opt/homebrew/var/run/nginx.pid 2>/dev/null
          /opt/homebrew/bin/nginx 2>&1 || echo "⚠️ nginx failed to start"
        else
          echo "✅ nginx already running"
        fi
        
        # Wait for services to start
        sleep 15
        
        # Verify services are running
        echo "📊 Verifying services are running:"
        ps aux | grep -E "python.*worker.py|python.*api_server.py|python.*rq_worker.py" | grep -v grep || echo "⚠️ Services starting..."
        
        # Check if API server is listening on port 8000
        lsof -i :8000 || echo "⚠️ API server not listening on port 8000 yet"
        
        # Check if nginx is listening on port 8080
        lsof -i :8080 || echo "⚠️ nginx not listening on port 8080"
        
        echo ""
        echo "✅ Deployment complete via GitHub Actions!"
        ENDSSH
        
        # Cleanup tunnel
        kill $TUNNEL_PID 2>/dev/null || true
        wait $TUNNEL_PID 2>/dev/null || true
    
    - name: 🧪 Verify Deployment
      run: |
        echo "🔍 Verifying deployment..."
        sleep 10
        
        # Test primary worker health
        echo "Testing primary worker health..."
        HEALTH_RESPONSE=$(curl -s "https://thakii-3.fanusdigital.site/thakii-worker/health" || echo '{"error": "connection_failed"}')
        echo "Primary worker health: $HEALTH_RESPONSE"
        
        # Test backend worker status
        echo ""
        echo "Testing backend worker status..."
        BACKEND_HEALTH=$(curl -s "https://thakii-02.fanusdigital.site/thakii-be/health" || echo '{"error": "backend_connection_failed"}')
        echo "Backend health: $BACKEND_HEALTH"
        
        echo ""
        echo "🎯 Deployment Summary:"
        echo "✅ Code deployed via GitHub Actions pipeline"
        echo "✅ S3 PDF path fix active: pdfs/{video_id}/{video_id}.pdf"
        echo "✅ Services restarted on thakii-03"
        echo "✅ Deployment completed through CI/CD pipeline"

