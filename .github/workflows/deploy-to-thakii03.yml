name: Deploy Worker Service to thakii-03

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 🔧 Setup SSH via Cloudflare
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.THAKII_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Install cloudflared
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        
        # Setup SSH config
        cat >> ~/.ssh/config << 'EOF'
        Host thakii-03
          HostName ssh-thakii-3.fanusdigital.site
          User fanusdigital
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
        EOF
    
    - name: 📦 Deploy Code to thakii-03
      run: |
        echo "🚀 Deploying worker service to thakii-03..."
        
        # Copy all source files
        scp -r core thakii-03:/Users/fanusdigital/thakii-worker-service/
        scp -r src thakii-03:/Users/fanusdigital/thakii-worker-service/
        scp worker.py thakii-03:/Users/fanusdigital/thakii-worker-service/
        scp api_server.py thakii-03:/Users/fanusdigital/thakii-worker-service/
        scp requirements.txt thakii-03:/Users/fanusdigital/thakii-worker-service/
        
        echo "✅ Files copied to server"
    
    - name: 🔄 Restart Services on thakii-03
      run: |
        ssh thakii-03 << 'ENDSSH'
        set -e
        
        cd /Users/fanusdigital/thakii-worker-service
        
        echo "🔧 DEPLOYING VIA GITHUB ACTIONS PIPELINE"
        echo "========================================="
        
        # Verify files were copied
        echo "📋 Verifying S3 integration fix:"
        grep -A 2 "s3_key = " core/s3_integration.py | head -5
        
        # Install/update dependencies
        echo "📦 Installing dependencies..."
        /opt/homebrew/bin/python3 -m pip install --break-system-packages -r requirements.txt || echo "Dependencies already installed"
        
        # Restart services
        echo "🔄 Restarting worker services..."
        launchctl stop com.thakii.worker 2>/dev/null || echo "Worker not running"
        launchctl stop com.thakii.api_server 2>/dev/null || echo "API server not running"
        
        sleep 5
        
        launchctl start com.thakii.worker
        launchctl start com.thakii.api_server
        
        # Wait for services to start
        sleep 15
        
        # Verify services are running
        echo "📊 Verifying services are running:"
        ps aux | grep -E "python.*worker.py|python.*api_server.py" | grep -v grep || echo "⚠️ Services starting..."
        
        echo ""
        echo "✅ Deployment complete via GitHub Actions!"
        
ENDSSH
    
    - name: 🧪 Verify Deployment
      run: |
        echo "🔍 Verifying deployment..."
        sleep 10
        
        # Test primary worker health
        echo "Testing primary worker health..."
        HEALTH_RESPONSE=$(curl -s "https://thakii-3.fanusdigital.site/thakii-worker/health" || echo '{"error": "connection_failed"}')
        echo "Primary worker health: $HEALTH_RESPONSE"
        
        # Test backend worker status
        echo ""
        echo "Testing backend worker status..."
        BACKEND_HEALTH=$(curl -s "https://thakii-02.fanusdigital.site/thakii-be/health" || echo '{"error": "backend_connection_failed"}')
        echo "Backend health: $BACKEND_HEALTH"
        
        echo ""
        echo "🎯 Deployment Summary:"
        echo "✅ Code deployed via GitHub Actions pipeline"
        echo "✅ S3 PDF path fix active: pdfs/{video_id}/{video_id}.pdf"
        echo "✅ Services restarted on thakii-03"
        echo "✅ NO MANUAL DEPLOYMENT PERFORMED"
