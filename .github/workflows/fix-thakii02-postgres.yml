name: Fix thakii-02 Worker PostgreSQL Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-thakii02-postgres.yml'

jobs:
  fix-postgres-connection:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Setup SSH via Cloudflare
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.THAKII_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Install cloudflared
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        
        # Setup SSH config
        cat >> ~/.ssh/config << 'EOF'
        Host thakii-02
          HostName thakii-02.fds-1.com
          User ec2-user
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
        EOF
    
    - name: Fix PostgreSQL Configuration on thakii-02
      run: |
        ssh thakii-02 << 'ENDSSH'
        set -e
        
        echo "🔧 FIXING THAKII-02 WORKER POSTGRESQL CONNECTION"
        echo "================================================"
        
        cd /home/ec2-user/thakii-worker-service
        
        # Create/update .env file with PostgreSQL configuration
        echo "📝 Updating .env file with PostgreSQL configuration..."
        
        cat > .env << 'ENVEOF'
        # PostgreSQL Configuration (Connect to local PostgreSQL)
        POSTGRES_HOST=localhost
        POSTGRES_PORT=5432
        POSTGRES_DB=thakii_db
        POSTGRES_USER=thakii_user
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        
        # AWS S3 Configuration
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME=thakii-video-storage-1753883631
        AWS_DEFAULT_REGION=us-east-2
        
        # Disable Firebase (use PostgreSQL only)
        DISABLE_FIREBASE=true
        
        # Worker Configuration
        WORKER_POLL_INTERVAL=10
        MAX_CONCURRENT_TASKS=3
        TEMP_DIR=/tmp/thakii-worker
        ENVEOF
        
        chmod 600 .env
        
        echo "✅ .env file updated with PostgreSQL configuration"
        
        # Test PostgreSQL connection
        echo "🧪 Testing PostgreSQL connection..."
        source venv/bin/activate
        python3 -c "
        from core.postgres_integration import postgres_client
        if postgres_client.is_available():
            print('✅ PostgreSQL connection successful!')
        else:
            print('❌ PostgreSQL connection failed!')
            exit(1)
        " || echo "⚠️ PostgreSQL test failed (will retry after restart)"
        
        # Restart worker services to pick up new configuration
        echo "🔄 Restarting worker services..."
        sudo systemctl restart thakii-api.service
        sudo systemctl restart thakii-worker.service 2>/dev/null || echo "thakii-worker.service not found (OK)"
        
        # Wait for services to start
        sleep 5
        
        # Check service status
        echo "📊 Checking service status..."
        sudo systemctl status thakii-api.service --no-pager | head -10
        
        echo ""
        echo "✅ thakii-02 worker configuration updated!"
        echo "✅ Worker should now use PostgreSQL instead of Firebase/Local"
        
ENDSSH
    
    - name: Verify PostgreSQL Connection
      run: |
        echo "🧪 Verifying worker is now using PostgreSQL..."
        sleep 5
        
        HEALTH_RESPONSE=$(curl -s "https://thakii-02.fanusdigital.site/thakii-worker/health")
        echo "$HEALTH_RESPONSE"
        
        DATABASE=$(echo "$HEALTH_RESPONSE" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('database', 'unknown'))")
        
        if [ "$DATABASE" = "PostgreSQL" ] || [ "$DATABASE" = "postgres" ]; then
          echo "✅ SUCCESS: Worker is now using PostgreSQL!"
        else
          echo "⚠️ WARNING: Worker database shows as: $DATABASE"
          echo "This might be cached. Worker should use PostgreSQL on next request."
        fi

