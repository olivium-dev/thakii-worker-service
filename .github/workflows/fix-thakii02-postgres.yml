name: Deploy Worker Service to thakii-03 (Primary Worker)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-thakii02-postgres.yml'

jobs:
  deploy-primary-worker:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup SSH via Cloudflare
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.THAKII_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Install cloudflared
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        
        # Setup SSH config for thakii-03
        cat >> ~/.ssh/config << 'EOF'
        Host thakii-03
          HostName ssh-thakii-3.fanusdigital.site
          User fanusdigital
          ProxyCommand cloudflared access ssh --hostname %h
          StrictHostKeyChecking no
        EOF
    
    - name: Deploy Worker Service to thakii-03
      run: |
        # Copy worker service files to thakii-03
        echo "📦 Deploying worker service files to thakii-03..."
        scp -r . thakii-03:/Users/fanusdigital/thakii-worker-service-new/
        
        ssh thakii-03 << 'ENDSSH'
        set -e
        
        echo "🚀 DEPLOYING PRIMARY WORKER SERVICE TO THAKII-03"
        echo "================================================"
        
        # Backup existing installation if it exists
        if [ -d "/Users/fanusdigital/thakii-worker-service" ]; then
          echo "📋 Backing up existing worker service..."
          mv /Users/fanusdigital/thakii-worker-service /Users/fanusdigital/thakii-worker-service-backup-$(date +%Y%m%d_%H%M%S)
        fi
        
        # Move new installation to correct location
        mv /Users/fanusdigital/thakii-worker-service-new /Users/fanusdigital/thakii-worker-service
        cd /Users/fanusdigital/thakii-worker-service
        
        # Create logs directory
        mkdir -p logs
        
        # Create/update .env file with HTTP database configuration
        echo "📝 Creating .env file with HTTP database configuration..."
        
        cat > .env << 'ENVEOF'
        # Use HTTP-based database connection (via backend API)
        USE_HTTP_DATABASE=true
        BACKEND_API_URL=https://thakii-02.fanusdigital.site/thakii-be
        
        # AWS S3 Configuration
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME=thakii-video-storage-1753883631
        AWS_DEFAULT_REGION=us-east-2
        
        # Worker Configuration (Mac Mini M2 Optimized)
        WORKER_POLL_INTERVAL=10
        MAX_CONCURRENT_TASKS=3
        TEMP_DIR=/tmp/thakii-worker
        ENVEOF
        
        chmod 600 .env
        
        echo "✅ .env file created with HTTP database configuration"
        
        # Install/update Python dependencies
        echo "📦 Installing Python dependencies..."
        /opt/homebrew/bin/python3 -m pip install --break-system-packages -r requirements.txt
        
        # Stop any existing worker/API server processes
        echo "🛑 Stopping existing worker processes..."
        pkill -f "python.*worker.py" || echo "No worker processes to kill"
        pkill -f "python.*api_server.py" || echo "No API server processes to kill"
        
        # Unload existing LaunchDaemons if they exist
        launchctl unload ~/Library/LaunchAgents/com.thakii.worker.plist 2>/dev/null || echo "Worker LaunchDaemon not loaded"
        launchctl unload ~/Library/LaunchAgents/com.thakii.api_server.plist 2>/dev/null || echo "API server LaunchDaemon not loaded"
        
        # Create LaunchDaemon for Worker Process
        echo "🔧 Creating LaunchDaemon for worker process..."
        cat > ~/Library/LaunchAgents/com.thakii.worker.plist << 'WORKEREOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>Label</key>
    <string>com.thakii.worker</string>
    <key>ProgramArguments</key>
    <array>
        <string>/opt/homebrew/bin/python3</string>
        <string>/Users/fanusdigital/thakii-worker-service/worker.py</string>
    </array>
    <key>WorkingDirectory</key>
    <string>/Users/fanusdigital/thakii-worker-service</string>
    <key>StandardOutPath</key>
    <string>/Users/fanusdigital/thakii-worker-service/logs/worker.log</string>
    <key>StandardErrorPath</key>
    <string>/Users/fanusdigital/thakii-worker-service/logs/worker_error.log</string>
    <key>KeepAlive</key>
    <dict>
        <key>SuccessfulExit</key>
        <false/>
    </dict>
    <key>RunAtLoad</key>
    <true/>
    <key>EnvironmentVariables</key>
    <dict>
        <key>PATH</key>
        <string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>
        <key>USE_HTTP_DATABASE</key>
        <string>true</string>
        <key>BACKEND_API_URL</key>
        <string>https://thakii-02.fanusdigital.site/thakii-be</string>
    </dict>
</dict>
</plist>
WORKEREOF
        
        # Create LaunchDaemon for API Server Process
        echo "🔧 Creating LaunchDaemon for API server process..."
        cat > ~/Library/LaunchAgents/com.thakii.api_server.plist << 'APIEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>Label</key>
    <string>com.thakii.api_server</string>
    <key>ProgramArguments</key>
    <array>
        <string>/opt/homebrew/bin/python3</string>
        <string>/Users/fanusdigital/thakii-worker-service/api_server.py</string>
        <string>--port</string>
        <string>8000</string>
    </array>
    <key>WorkingDirectory</key>
    <string>/Users/fanusdigital/thakii-worker-service</string>
    <key>StandardOutPath</key>
    <string>/Users/fanusdigital/thakii-worker-service/logs/api_server.log</string>
    <key>StandardErrorPath</key>
    <string>/Users/fanusdigital/thakii-worker-service/logs/api_server_error.log</string>
    <key>KeepAlive</key>
    <dict>
        <key>SuccessfulExit</key>
        <false/>
    </dict>
    <key>RunAtLoad</key>
    <true/>
    <key>EnvironmentVariables</key>
    <dict>
        <key>PATH</key>
        <string>/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>
        <key>USE_HTTP_DATABASE</key>
        <string>true</string>
        <key>BACKEND_API_URL</key>
        <string>https://thakii-02.fanusdigital.site/thakii-be</string>
    </dict>
</dict>
</plist>
APIEOF
        
        # Load and start both LaunchDaemons
        echo "🚀 Loading and starting worker LaunchDaemon..."
        launchctl load ~/Library/LaunchAgents/com.thakii.worker.plist
        launchctl start com.thakii.worker
        
        echo "🚀 Loading and starting API server LaunchDaemon..."
        launchctl load ~/Library/LaunchAgents/com.thakii.api_server.plist
        launchctl start com.thakii.api_server
        
        # Wait for services to start
        echo "⏳ Waiting for services to start..."
        sleep 10
        
        # Verify both services are running
        echo "📊 Checking service status..."
        echo "Worker process:"
        ps aux | grep -E "python.*worker.py" | grep -v grep || echo "❌ Worker process not found"
        
        echo "API server process:"
        ps aux | grep -E "python.*api_server.py" | grep -v grep || echo "❌ API server process not found"
        
        # Test API server health endpoint
        echo "🧪 Testing API server health endpoint..."
        curl -s http://localhost:8000/health || echo "❌ API server health check failed"
        
        echo ""
        echo "✅ thakii-03 primary worker deployment completed!"
        echo "✅ Both worker process and API server are now running with LaunchDaemons"

ENDSSH
    
    - name: Verify Primary Worker Deployment
      run: |
        echo "🧪 Verifying primary worker deployment on thakii-03..."
        sleep 15
        
        # Test the API server health endpoint via Nginx proxy
        echo "Testing API server via Nginx proxy..."
        HEALTH_RESPONSE=$(curl -s "https://thakii-3.fanusdigital.site/thakii-worker/health" || echo '{"error": "connection_failed"}')
        echo "Health Response: $HEALTH_RESPONSE"
        
        # Test backend's worker health check
        echo ""
        echo "Testing backend's worker health check..."
        BACKEND_HEALTH=$(curl -s "https://thakii-02.fanusdigital.site/thakii-be/health" || echo '{"error": "backend_connection_failed"}')
        echo "Backend Health: $BACKEND_HEALTH"
        
        # Check if primary worker is now healthy
        PRIMARY_STATUS=$(echo "$BACKEND_HEALTH" | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    workers = data.get('workers', {})
    primary = workers.get('primary', {})
    print(primary.get('status', 'unknown'))
except:
    print('parse_error')
" 2>/dev/null || echo "unknown")
        
        echo "Primary worker status: $PRIMARY_STATUS"
        
        if [[ "$PRIMARY_STATUS" == *"healthy"* ]] || [[ "$PRIMARY_STATUS" == "200" ]]; then
          echo "✅ SUCCESS: Primary worker (thakii-03) is now healthy!"
          echo "✅ Both worker process and API server are running correctly"
        else
          echo "⚠️ WARNING: Primary worker status is: $PRIMARY_STATUS"
          echo "The deployment may need a few more minutes to fully initialize"
          echo "Check the logs on thakii-03 for any startup issues"
        fi
        
        echo ""
        echo "🎯 Deployment Summary:"
        echo "- Worker service deployed to thakii-03"
        echo "- Both worker process and API server configured with LaunchDaemons"
        echo "- HTTP database connection configured"
        echo "- AWS S3 credentials configured"
        echo "- Nginx proxy should now route to healthy API server on port 8000"

