name: Install ffmpeg on thakii-02 Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'install_ffmpeg_thakii02.yml'

env:
  SERVER_HOST: thakii-02.fanusdigital.site
  SERVER_USER: ec2-user
  WORKER_DIR: /home/ec2-user/thakii-worker-service

jobs:
  install_ffmpeg:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install ffmpeg on thakii-02 worker
      env:
        SSH_PASSWORD: ${{ secrets.thakii_ssh_password }}
      run: |
        echo "🔧 Installing ffmpeg on thakii-02 worker..."
        
        # Install cloudflared for SSH access
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        sudo apt-get update && sudo apt-get install -y sshpass
        
        # SSH to thakii-02 and install ffmpeg
        sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -o ProxyCommand="cloudflared access ssh --hostname $SERVER_HOST" \
          $SERVER_USER@$SERVER_HOST bash << 'EOF'
        
        echo "=== Installing ffmpeg on Amazon Linux ==="
        sudo yum update -y
        sudo yum install -y epel-release
        sudo yum install -y ffmpeg
        
        echo ""
        echo "=== Verifying ffmpeg installation ==="
        which ffmpeg
        ffmpeg -version | head -3
        
        echo ""
        echo "=== Adding ffmpeg to worker environment ==="
        cd $WORKER_DIR
        
        # Ensure ffmpeg is in PATH for the worker
        echo 'export PATH="/usr/bin:$PATH"' >> ~/.bashrc
        
        echo ""
        echo "=== Restarting worker service ==="
        sudo systemctl restart thakii-worker.service
        sleep 5
        sudo systemctl status thakii-worker.service --no-pager
        
        echo ""
        echo "=== Testing worker health ==="
        curl -s http://localhost:8000/health | python3 -m json.tool
        
        echo ""
        echo "=== Testing ffmpeg from worker environment ==="
        python3 << 'PYEOF'
import subprocess
import os
try:
    result = subprocess.run(['ffmpeg', '-version'], capture_output=True, text=True, timeout=5)
    print(f'✅ ffmpeg test from Python: {result.returncode == 0}')
    if result.returncode == 0:
        print(f'   Version: {result.stdout.split()[2]}')
except Exception as e:
    print(f'❌ ffmpeg test failed: {e}')
PYEOF
        
        echo "✅ ffmpeg installation and testing complete!"
        
EOF
        
        echo "🎉 ffmpeg installation on thakii-02 complete!"
