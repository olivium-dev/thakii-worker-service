name: Fix nginx on thakii-03

on:
  workflow_dispatch:

jobs:
  fix_nginx:
    runs-on: ubuntu-22.04
    steps:
    - name: Setup SSH tools
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        sudo apt-get update && sudo apt-get install -y sshpass

    - name: Restart nginx on thakii-03
      env:
        THAKII_PASSWORD: ${{ secrets.THAKII_03_PASSWORD }}
      run: |
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2201 &
        TUNNEL_PID=$!
        sleep 15

        echo "🔧 Fixing nginx on thakii-03..."

        sshpass -p "$THAKII_PASSWORD" ssh -o StrictHostKeyChecking=no -p 2201 fanusdigital@localhost bash << 'ENDSSH'
        set +e

        echo "=== Before fix ==="
        echo "nginx processes:"
        ps aux | grep nginx | grep -v grep || echo "  nginx NOT running"
        echo ""
        echo "Port 8080:"
        lsof -i :8080 2>/dev/null || echo "  Nothing on 8080"

        echo ""
        echo "============================================"
        echo "  FIX: nginx PID file permission denied"
        echo "============================================"

        echo "Checking /opt/homebrew/var/run/ permissions:"
        ls -la /opt/homebrew/var/run/ 2>/dev/null || echo "  Directory doesn't exist!"

        echo ""
        echo "Fixing PID directory permissions..."
        mkdir -p /opt/homebrew/var/run 2>/dev/null
        chmod 755 /opt/homebrew/var/run 2>/dev/null

        echo "Removing stale PID file if any..."
        rm -f /opt/homebrew/var/run/nginx.pid 2>/dev/null

        echo "Checking ownership of /opt/homebrew/var/run/:"
        ls -la /opt/homebrew/var/ 2>/dev/null | grep run

        echo ""
        echo "Checking if /opt/homebrew/var/run is owned by us:"
        whoami
        stat -f "%Su:%Sg %Sp" /opt/homebrew/var/run/ 2>/dev/null || stat -c "%U:%G %a" /opt/homebrew/var/run/ 2>/dev/null

        echo ""
        echo "Fixing homebrew ownership..."
        chown -R $(whoami) /opt/homebrew/var/run 2>/dev/null || echo "  chown failed (may need sudo)"
        chmod -R 755 /opt/homebrew/var/run 2>/dev/null

        echo ""
        echo "Also check/fix nginx server config dir:"
        ls -la /opt/homebrew/etc/nginx/servers/ 2>/dev/null || echo "  No servers dir"

        echo ""
        echo "=== Killing any stale nginx master process ==="
        pkill -f "nginx: master" 2>/dev/null || echo "  No stale master to kill"
        sleep 1

        echo ""
        echo "=== Starting nginx directly to test ==="
        /opt/homebrew/bin/nginx -t 2>&1
        NGINX_TEST=$?

        if [ $NGINX_TEST -eq 0 ]; then
          echo "Config test passed. Starting nginx..."
          /opt/homebrew/bin/nginx 2>&1
          sleep 2
        else
          echo "Config test FAILED. Checking for issues..."
          echo ""
          echo "Full nginx config:"
          cat /opt/homebrew/etc/nginx/nginx.conf
          echo ""
          echo "Server configs:"
          cat /opt/homebrew/etc/nginx/servers/* 2>/dev/null || echo "  No server configs"
        fi

        echo ""
        echo "=== After fix ==="
        echo "nginx processes:"
        ps aux | grep nginx | grep -v grep || echo "  nginx still NOT running!"
        echo ""
        echo "Port 8080:"
        lsof -i :8080 2>/dev/null || echo "  Still nothing on 8080"

        echo ""
        echo "=== Testing full request chain ==="
        echo "1. Direct to Flask (8000):"
        curl -s http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  status={d[\"status\"]}')" 2>/dev/null || echo "  Flask not responding"

        echo "2. Through nginx (8080) with /thakii-worker prefix:"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/thakii-worker/health 2>/dev/null)
        echo "  HTTP $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          curl -s http://localhost:8080/thakii-worker/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  status={d[\"status\"]}')" 2>/dev/null
        fi

        echo ""
        echo "3. nginx error log (last 5 lines):"
        tail -5 /opt/homebrew/var/log/nginx/error.log 2>/dev/null || echo "  No error log"

        echo ""
        echo "=== Done ==="
        ENDSSH

        kill $TUNNEL_PID 2>/dev/null || true
        wait $TUNNEL_PID 2>/dev/null || true

    - name: Verify public endpoint
      run: |
        echo "Waiting 10s..."
        sleep 10

        echo "=== Testing public endpoint ==="
        HTTP_CODE=$(curl -s -o /tmp/health_response.txt -w "%{http_code}" "https://thakii-3.fanusdigital.site/thakii-worker/health")
        echo "HTTP Status: $HTTP_CODE"
        cat /tmp/health_response.txt

        if [ "$HTTP_CODE" = "200" ]; then
          echo ""
          echo "🎉 SUCCESS! The 502 is fixed. Public endpoint is healthy."
        else
          echo ""
          echo "⚠️ Still getting HTTP $HTTP_CODE. May need further investigation."
        fi
