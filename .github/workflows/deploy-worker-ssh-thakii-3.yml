name: Deploy Worker to ssh-thakii-3

on:
  push:
    branches: [ main, feature/whisper-ai-installation-pipeline ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
        sudo dpkg -i cloudflared.deb
        sudo apt-get update
        sudo apt-get install -y sshpass
        
    - name: Test SSH connection
      run: |
        echo "Testing SSH connection to ssh-thakii-3.fanusdigital.site"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'echo "SSH connection successful"'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Setup repository
      run: |
        echo "Setting up repository"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'if [ ! -d "thakii-worker-service" ]; then git clone https://github.com/olivium-dev/thakii-worker-service.git; fi'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Update code
      run: |
        echo "Updating code"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'cd thakii-worker-service && git fetch origin && git checkout feature/whisper-ai-installation-pipeline && git reset --hard origin/feature/whisper-ai-installation-pipeline'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Setup Python environment
      run: |
        echo "Setting up Python environment"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'cd thakii-worker-service && if [ ! -d "venv" ]; then python3 -m venv venv; fi && source venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Stop existing services
      run: |
        echo "Stopping existing services"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'pkill -f "worker.py" || true; pkill -f "api_server.py" || true; sleep 2'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Start worker service
      run: |
        echo "Starting worker service"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'cd thakii-worker-service && source venv/bin/activate && nohup python3 worker.py --process-all > worker.log 2>&1 & echo "Worker started with PID: $!"'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Start API service
      run: |
        echo "Starting API service"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'cd thakii-worker-service && source venv/bin/activate && nohup python3 api_server.py > api_server.log 2>&1 & echo "API started with PID: $!"'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Verify deployment
      run: |
        echo "Verifying deployment"
        cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site --url ssh://localhost:2222 &
        TUNNEL_PID=$!
        sleep 5
        sshpass -p 'P@ssw0rd768' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null fanusdigital@localhost -p 2222 'echo "=== Process Status ==="; ps aux | grep -E "(worker|api_server)" | grep -v grep || echo "No processes found"'
        kill $TUNNEL_PID 2>/dev/null || true
        
    - name: Summary
      run: |
        echo "🎉 Deployment to ssh-thakii-3.fanusdigital.site completed!"
        echo "📍 Server: ssh-thakii-3.fanusdigital.site"
        echo "🔑 Authentication: Password (sshpass)"
        echo "📦 Services: Worker + API Server"