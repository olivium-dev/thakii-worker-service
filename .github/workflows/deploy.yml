name: Deploy Worker Service to Server

on:
  push:
    branches:
      - main
      - feature/postgres-migration
  workflow_dispatch:

env:
  SERVER_HOST: vps-71.fds-1.com
  SERVER_USER: ec2-user
  DEPLOY_PATH: /home/ec2-user/thakii-worker-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH Connection via Cloudflare
        uses: ./.github/actions/cloudflare-ssh
        with:
          ssh-password: ${{ secrets.SERVER_PASSWORD }}
          server-hostname: ${{ env.SERVER_HOST }}
          server-user: ${{ env.SERVER_USER }}
          host-alias: 'thakii-server'
      
      - name: Deploy to server
        env:
          SSH_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh thakii-server << EOF
            set -e
            
            echo "=== Deploying Worker Service ==="
            cd $DEPLOY_PATH || exit 1
            
            # Get current branch name
            BRANCH_NAME=\$(git rev-parse --abbrev-ref HEAD)
            echo "Current branch: \$BRANCH_NAME"
            
            # Stash any local changes
            git stash
            
            # Fetch and pull latest changes
            git fetch origin
            git pull origin \$BRANCH_NAME
            
            # Install dependencies
            pip3 install --user -r requirements.txt
            
            # Restart service
            sudo systemctl restart thakii-worker
            
            # Check service status
            sleep 3
            sudo systemctl status thakii-worker --no-pager
            
            echo "=== Worker deployment complete ==="
          EOF
      
      - name: Verify deployment
        env:
          SSH_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # Wait for service to be ready
          sleep 5
          
          # Check if service is running via SSH
          sshpass -p "$SSH_PASSWORD" ssh thakii-server << 'EOF'
            if sudo systemctl is-active --quiet thakii-worker; then
              echo "✅ Worker service is running"
              exit 0
            else
              echo "❌ Worker service is not running"
              exit 1
            fi
          EOF
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi
