name: 🚀 Thakii-03 Simple Access

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-access:
    name: 🔍 Test Access to Thakii-03
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Install curl
      run: sudo apt-get update && sudo apt-get install -y curl

    - name: 🔍 Test API Access
      run: |
        echo "🔍 Testing API access to thakii-03..."
        curl -s https://thakii-3.fanusdigital.site/thakii-worker/health || echo "❌ API access failed"
        
        echo ""
        echo "🔍 Testing API endpoints..."
        curl -s https://thakii-3.fanusdigital.site/thakii-worker/ || echo "❌ Root endpoint access failed"

    - name: 📊 Access Summary
      run: |
        echo "## 🚀 Thakii-03 Access Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Endpoint | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| /health | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
        echo "| / | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎯 **Access test completed**" >> $GITHUB_STEP_SUMMARY

  deploy-webhook:
    name: 🚀 Deploy via Webhook
    runs-on: ubuntu-latest
    needs: test-access
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔧 Install curl
      run: sudo apt-get update && sudo apt-get install -y curl

    - name: 🚀 Trigger Deployment Webhook
      run: |
        echo "🚀 Triggering deployment webhook..."
        
        # Create payload
        cat > payload.json << 'PAYLOAD_EOF'
        {
          "trigger": "github-actions",
          "commit": "${{ github.sha }}",
          "repository": "${{ github.repository }}",
          "ref": "${{ github.ref }}",
          "workflow": "${{ github.workflow }}"
        }
        PAYLOAD_EOF
        
        # Send webhook request
        curl -X POST \
          -H "Content-Type: application/json" \
          -d @payload.json \
          https://thakii-3.fanusdigital.site/thakii-worker/deploy || echo "❌ Webhook failed"
        
        echo ""
        echo "⏱️ Waiting 10 seconds for deployment to start..."
        sleep 10
        
        # Check status
        echo "🔍 Checking deployment status..."
        curl -s https://thakii-3.fanusdigital.site/thakii-worker/status || echo "❌ Status check failed"

    - name: 📊 Deployment Summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Webhook Trigger | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "| Status Check | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎉 **Deployment triggered via webhook**" >> $GITHUB_STEP_SUMMARY
